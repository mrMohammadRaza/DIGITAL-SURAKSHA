name: Digital Suraksha CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: digital_suraksha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: TypeScript Type Checking
        run: |
          npx tsc --noEmit --project packages/shared/tsconfig.json
          npx tsc --noEmit --project packages/backend/tsconfig.json
          npx tsc --noEmit --project packages/frontend/tsconfig.json

      - name: Generate Prisma Client & Run Database Seeds
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          npm run prisma:generate --workspace=packages/backend
          npm run prisma:push --workspace=packages/backend
          npm run prisma:seed --workspace=packages/backend

      - name: Execute Backend Tests (Vitest + Supertest)
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci_super_secret_jwt_key_suraksha_32_chars!"
        run: npm run test:backend

      - name: Execute Frontend Component Tests (Vitest + RTL)
        run: npm run test:frontend

      - name: Build Production Frontend Bundle
        run: npm run build --workspace=packages/frontend

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist/
